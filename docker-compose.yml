# Postgres local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kritica
      POSTGRES_PASSWORD: kritica
      POSTGRES_DB: kritica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
